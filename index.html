<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squeezit</title>
    <link href="css/grid.css" rel="stylesheet" type="text/css" media="screen">
    <link href="css/home.css" rel="stylesheet" type="text/css" media="screen">
</head>
<body>
    <h1 class="hidden">Welcome to Squeezit page!</h1>
    <header>
        <div class="grid-con">
            <div class="col-span-full l-col-span-3 m-col-span-3 xl-col-span-3 logo-box">
                <div class="img_div">
                    <img src="images/main_logo.png" alt="Logo" class="logo-img">
                </div>    
            </div>
            <div class="col-span-full l-col-span-5 l-col-start-8 m-col-span-5 m-col-start-8 xl-col-span-5 xl-col-start-8 nav-box">
                <h2 class="hidden">Main Navigation</h2>
                <nav class="main-nav">
                    <a href="#">Home</a>
                    <a href="about.html">About Us</a>
                    <a href="flavors.html">Flavors</a>
                    <a href="contact.html">Contact Us</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="grid-con video">
            <h2 class="hidden">Cinemagraph Video</h2>
            <div class="col-span-full l-col-span-8 l-col-start-3 m-col-span-8 m-col-start-3 xl-col-span-8 xl-col-start-3 video-container">
                <video autoplay loop playsinline poster="videos/Kirs_Mikhail_Cinemagraph.mp4">
                    <source src="videos/Kirs_Mikhail_Cinemagraph.mp4" type="video/mp4">
                    <source src="videos/Kirs_Mikhail_Cinemagraph.mp4" type="video/webm">
                </video>
            </div>
        </section>
        <section class="grid-con">
            <h2 class="hidden">The product</h2>
            <div class="products col-span-4 m-col-span-6 l-col-span-4 xl-col-span-4">
                <img src="images/grape0000.jpg" alt="grape"/>
                <button class="buy-btn">Buy Grape</button>
            </div>
            <div class="products col-span-4 m-col-span-6 l-col-span-4 xl-col-span-4">
                <img src="images/strawberry0000.jpg" alt="strawberry"/>
                <button class="buy-btn">Buy Strawberry</button>
            </div>
            <div class="products col-span-4 m-col-span-6 l-col-span-4 xl-col-span-4">
                <img src="images/orange0000.jpg" alt="orange"/>
                <button class="buy-btn">Buy Orange</button>
            </div>

            <div class="products col-span-4 m-col-span-6 l-col-span-4 xl-col-span-4">
                <img src="images/apple0000.jpg" alt="apple"/>
                <button class="buy-btn">Buy Apple</button>
            </div>
            <div class="products col-span-4 m-col-span-6 l-col-span-4 xl-col-span-4">
                <img src="images/watermelon0000.jpg" alt="watermelon"/>
                <button class="buy-btn">Buy Watermelon</button>
            </div>
            <div class="products col-span-4 m-col-span-6 l-col-span-4 xl-col-span-4">
                <img src="images/cherry0000.jpg" alt="cherry"/>
                <button class="buy-btn">Buy Cherry</button>
            </div>
        </section>
    </main>
    <footer>
        <h2 class="hidden">footer</h2>
            <section class="grid-con">
                <div class="l-col-span-2 l-col-start-6 m-col-span-2 m-col-start-6 col-span-full xl-col-span-2 xl-col-start-6 footer_box">
                    <div class="footer_div">
                        <img src="images/main_logo.png" alt="Logo" class="footer-logo">
                    </div>
                </div>
                <div class="l-col-span-3 l-col-start-10 m-col-span-3 m-col-start-10 col-span-4 xl-col-span-3 xl-col-start-10">
                    <h2 class="hidden">Social Media</h2>
                    <div class="social-icons">
                        <a href="https://www.twitter.com" target="blank">
                            <img src="images/twitter.png" alt="Twitter" class="social-icon">
                        </a>
                        <a href="https://www.instagram.com" target="blank">
                            <img src="images/instagram.png" alt="Instagram" class="social-icon">
                        </a>
                        <a href="https://www.youtube.com/" target="blank">
                            <img src="images/youtube.png" alt="Youtube" class="social-icon">
                        </a>
                    </div> 
                </div>
            </section>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
